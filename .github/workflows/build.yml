name: Build VST3 (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Find and package VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "*.vst3" -Directory | Select-Object -First 1
          Copy-Item -Recurse $vst3.FullName "FantomFuzz.vst3"

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FantomFuzz-VST3-Windows
          path: FantomFuzz.vst3
